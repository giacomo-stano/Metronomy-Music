name: Build Metronomy iOS IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da compilare (es. 0.2.3)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate and apply release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $RELEASE_VERSION"
            echo "Use semantic versioning, for example 0.2.3"
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');

          const version = process.env.RELEASE_VERSION;
          const buildNumber = process.env.BUILD_NUMBER;

          const appPath = 'app.json';
          const app = JSON.parse(fs.readFileSync(appPath, 'utf8'));
          app.expo.version = version;
          app.expo.ios = app.expo.ios || {};
          app.expo.ios.bundleIdentifier = 'com.anonymous.metronomy';
          app.expo.ios.buildNumber = buildNumber;
          fs.writeFileSync(appPath, JSON.stringify(app, null, 2) + '\n');

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');

          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = version;
          if (lock.packages && lock.packages['']) {
            lock.packages[''].version = version;
          }
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');
          NODE

          echo "Metronomy $RELEASE_VERSION (build $BUILD_NUMBER)"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Generate iOS project
        env:
          CI: "1"
        run: npx expo prebuild --platform ios --clean

      - name: Ensure CocoaPods are installed
        run: |
          cd ios
          pod install

      - name: Verify Metronomy native audio controls are linked
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "MetronomyAudioControls" ios/Podfile.lock; then
            echo "MetronomyAudioControls was not linked into the iOS project."
            exit 1
          fi

          echo "MetronomyAudioControls is linked."

      - name: Detect Xcode workspace and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found in ios/"
            find ios -maxdepth 2 -print
            exit 1
          fi

          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Build Metronomy for a physical iPhone without signing
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/DerivedData
          mkdir -p build

          set +e
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            grep -nE '(^|[[:space:]])error:|CompileSwift|SwiftCompile' build/xcodebuild.log | tail -n 200 || true
            exit "$BUILD_STATUS"
          fi

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="build/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS" -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle was produced."
            exit 1
          fi

          rm -rf build/Payload build/Metronomy.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build
          /usr/bin/zip -qry Metronomy.ipa Payload
          ls -lh Metronomy.ipa

      - name: Verify IPA metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          TMP_DIR="$(mktemp -d)"
          unzip -q build/Metronomy.ipa -d "$TMP_DIR"
          INFO_PLIST="$(find "$TMP_DIR/Payload" -maxdepth 2 -name Info.plist -print -quit)"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")"

          echo "Bundle ID: $BUNDLE_ID"
          echo "Version:   $VERSION"
          echo "Build:     $BUILD"

          test "$BUNDLE_ID" = "com.anonymous.metronomy"
          test "$VERSION" = "$RELEASE_VERSION"
          test "$BUILD" = "$BUILD_NUMBER"

      - name: Commit verified version metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app.json package.json package-lock.json

          if git diff --cached --quiet; then
            echo "Version metadata already up to date."
          else
            git commit -m "chore: prepare iOS $RELEASE_VERSION build $BUILD_NUMBER"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload Metronomy IPA
        uses: actions/upload-artifact@v4
        with:
          name: Metronomy-${{ inputs.version }}-build-${{ github.run_number }}
          path: build/Metronomy.ipa
          if-no-files-found: error
          retention-days: 14


      - name: Publish stable GitHub release
        if: ${{ github.ref_name == 'develop' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          TAG="v${RELEASE_VERSION}-stable"
          TARGET_SHA="$(git rev-parse HEAD)"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Replacing existing release $TAG"
            gh release delete "$TAG"               --repo "$GITHUB_REPOSITORY"               --cleanup-tag               --yes
          fi

          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$TARGET_SHA"             --title "Metronomy $RELEASE_VERSION"             --notes "Metronomy $RELEASE_VERSION"

          RELEASE_ID="$(gh release view "$TAG"             --repo "$GITHUB_REPOSITORY"             --json databaseId             --jq '.databaseId')"

          curl --fail-with-body             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer $GH_TOKEN"             --header "X-GitHub-Api-Version: 2022-11-28"             --header "Content-Type: application/x-itunes-ipa"             --data-binary @build/Metronomy.ipa             "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=Metronomy.ipa"

      - name: Update AltStore source
        if: ${{ github.ref_name == 'develop' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          gh workflow run update-altstore-source.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f tag="v${RELEASE_VERSION}-stable"
