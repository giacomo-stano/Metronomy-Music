name: Build Metronomy iOS IPA

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'artifact = solo IPA; beta = AltStore Beta; stable = release ufficiale'
        type: choice
        options: [artifact, beta, stable]
        default: artifact
      confirm_stable:
        description: 'Confermo la pubblicazione di una release stabile (solo main)'
        type: boolean
        default: false
      notes:
        description: 'Novità mostrate in AltStore e nella release GitHub'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: metronomy-ios-${{ inputs.channel || 'artifact' }}
  cancel-in-progress: false

env:
  RELEASE_CHANNEL: ${{ inputs.channel || 'artifact' }}
  CONFIRM_STABLE: ${{ inputs.confirm_stable || false }}
  METRONOMY_CHANNEL: ${{ inputs.channel == 'beta' && 'beta' || 'stable' }}
  METRONOMY_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
  EXPO_PUBLIC_RELEASE_CHANNEL: ${{ inputs.channel == 'beta' && 'beta' || 'stable' }}
  EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate branch, channel and stable confirmation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-altstore.cjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Playback timeline regression tests
        run: |
          node tests/playback-timeline.cjs
          node tests/playback-source.cjs
          node tests/precise-audio-timing.cjs
          node tests/network-search.cjs
          node tests/server-downloads.cjs
          node tests/native-music-dock.cjs
          node tests/dock-motion.cjs
          node tests/library-bulk-navigation.cjs
          node tests/library-pagination.cjs
          node tests/library-search.cjs
          node tests/performance.cjs
          node tests/altstore-release.cjs
          python3 -m unittest discover -s tests -p 'test_ipa_manifest.py' -v

      - name: Generate iOS project
        env:
          CI: "1"
        run: npx expo prebuild --platform ios --clean

      - name: Verify precise native audio timing is applied
        run: node tests/precise-audio-timing.cjs --verify-installed

      - name: Ensure CocoaPods are installed
        run: |
          cd ios
          pod install

      - name: Verify Metronomy native audio controls are linked
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "MetronomyAudioControls" ios/Podfile.lock; then
            echo "MetronomyAudioControls was not linked into the iOS project."
            echo "Native AirPlay, system volume, and previous/next controls would be unavailable."
            exit 1
          fi

          echo "MetronomyAudioControls is linked."

      - name: Detect Xcode workspace and scheme
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found in ios/"
            find ios -maxdepth 2 -print
            exit 1
          fi

          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          xcodebuild -workspace "$WORKSPACE" -list

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Metronomy for a physical iPhone without signing
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/DerivedData
          mkdir -p build

          set +e
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo
            echo "===== Compiler errors ====="
            grep -nE '(^|[[:space:]])error:|CompileSwift|SwiftCompile' build/xcodebuild.log | tail -n 200 || true
            exit "$BUILD_STATUS"
          fi

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="build/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCTS" -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle was produced."
            find build/DerivedData/Build/Products -maxdepth 3 -print || true
            exit 1
          fi

          echo "Packaging: $APP_PATH"

          rm -rf build/Payload build/Metronomy.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build
          /usr/bin/zip -qry Metronomy.ipa Payload

          echo "Created:"
          ls -lh Metronomy.ipa

      - name: Upload Metronomy IPA
        uses: actions/upload-artifact@v4
        with:
          name: Metronomy-iOS-unsigned
          path: build/Metronomy.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Inspect actual IPA metadata and permissions
        run: python3 scripts/inspect-ipa.py build/Metronomy.ipa ios build/ipa-manifest.json

      - name: Upload publication inputs
        if: inputs.channel == 'beta' || inputs.channel == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: altstore-publication
          path: |
            build/Metronomy.ipa
            build/ipa-manifest.json
            build/release-plan.json
          if-no-files-found: error
          retention-days: 14

  publish-altstore:
    name: Publish selected AltStore channel
    needs: build-ios
    if: inputs.channel == 'beta' || inputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: altstore-publication
          path: build
      - name: Publish IPA, then update only the selected source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: node scripts/publish-altstore.cjs
